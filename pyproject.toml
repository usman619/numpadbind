[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numpadbind"
version = "0.1.0"
description = "Bind apps, scripts and actions to your numpad, with two layers (Linux)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["evdev>=1.6"]        # PyGObject/GTK3 come from apt (python3-gi), not pip
classifiers = ["Operating System :: POSIX :: Linux", "Environment :: X11 Applications :: GTK"]

[project.scripts]
numpadbind = "numpadbind.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
